<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FamiliAI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" width="28" height="28" alt="" />
      <div>
        <h1>FamiliAI</h1>
        <p class="tagline">Every website, instantly familiar.</p>
      </div>
    </header>

    <section id="site">
      <div class="row">
        <span id="host" class="host">—</span>
        <button id="toggle" type="button" disabled>Enable on this site</button>
      </div>
      <p id="scope" class="note"></p>
      <p id="note" class="note"></p>
      <ul id="actions" class="actions" hidden></ul>
      <div id="tools" class="row tools" hidden>
        <button id="report" type="button" class="secondary">Copy page report</button>
        <span id="reportNote" class="note"></span>
      </div>
    </section>

    <section id="prefs">
      <label class="row">
        <span>Dock position</span>
        <select id="position">
          <option value="right-center">Right edge</option>
          <option value="left-center">Left edge</option>
          <option value="top-right">Top right</option>
          <option value="bottom-right">Bottom right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="custom">Custom (drag the logo)</option>
        </select>
      </label>
      <label class="row" id="orientationRow" hidden>
        <span>Direction</span>
        <select id="orientation">
          <option value="vertical">Vertical</option>
          <option value="horizontal">Horizontal</option>
        </select>
      </label>
      <label class="row">
        <span>Auto-hide (show logo until hover)</span>
        <input id="autoHide" type="checkbox" />
      </label>
      <p class="note">Tip: drag the dock's logo anywhere on a page. It stays in that spot on every site.</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
